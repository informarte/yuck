name: CI

on: [push]

env:
  ACTIONS_RUNNER_DEBUG: true
  ACTIONS_STEP_DEBUG: true
  MINIZINC_VERSION: 2.9.3

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:

      - name: Check out repo
        uses: actions/checkout@v4

      - name: Install MiniZinc dependencies
        run: sudo apt install libegl1

      - name: Install MiniZinc
        run: |
          BUNDLE=MiniZincIDE-$MINIZINC_VERSION-bundle-linux-x86_64
          wget https://github.com/MiniZinc/MiniZincIDE/releases/download/$MINIZINC_VERSION/$BUNDLE.tgz
          tar xzf $BUNDLE.tgz
          ldd ./$BUNDLE/bin/minizinc
          ldd ./$BUNDLE/bin/fzn-gecode
          ldd ./$BUNDLE/bin/fzn-chuffed
          echo "$PWD/$BUNDLE/bin" >> $GITHUB_PATH

      - name: Verify binaries
        run: |
          minizinc --version
          fzn-gecode -help
          fzn-chuffed --help

      - name: Run CI tests
        run: make ci-tests

      - name: Tar logs
        run: tar cf logs.tar tmp/ --transform=s/^tmp/logs/

      - name: Upload logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: artifacts
          path: logs.tar
